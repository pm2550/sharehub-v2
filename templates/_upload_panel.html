<!-- 上传任务面板 — 内容由 static/js/uploader.js 动态填充 -->
<div class="upload-panel" id="upload-panel" role="region" aria-label="上传队列">
    <div class="upload-panel-head">
        <span class="upload-panel-title">上传队列</span>
        <span class="upload-panel-actions">
            <button type="button" class="upload-panel-btn" data-upload-toggle aria-label="折叠/展开">－</button>
            <button type="button" class="upload-panel-btn" data-upload-close aria-label="关闭">×</button>
        </span>
    </div>
    <div class="upload-resume-hint"></div>
    <div class="upload-panel-body"></div>
</div>
