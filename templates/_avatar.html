<div class="avatar-stage" data-avatar-size="{{ avatar_size|default('hero') }}" data-avatar-state="waiting" tabindex="0" role="group" aria-label="点击小星的手、脸或星星互动，也可使用下方动作按钮">
 <img class="avatar-poster" src="/static/images/sharehub-muse-800.webp" alt="银紫长发的小星坐在樱花月亮上" width="800" height="1200" loading="lazy">
 <button type="button" class="avatar-load" data-avatar-load>唤醒小星 ✦</button>
 <span class="avatar-status" role="status" aria-live="polite"></span>
</div>
<div class="avatar-controls" aria-label="和小星互动">
 <button type="button" data-avatar-action="wave" aria-pressed="false">热情招手</button>
 <button type="button" data-avatar-action="wink" aria-pressed="false">俏皮眨眼</button>
 <button type="button" data-avatar-action="smile" aria-pressed="false">开心笑眼</button>
 <button type="button" data-avatar-action="nod" aria-pressed="false">轻轻点头</button>
 <button type="button" data-avatar-action="tilt" aria-pressed="false">歪头看你</button>
 <button type="button" data-avatar-action="star" aria-pressed="false">接住星光</button>
</div>
