<header class="wrap topbar">
  <div>
    <h1><a href="/">{{ site_title }}</a></h1>
    <p>分享与创作平台</p>
  </div>
  <nav class="nav">
    <a class="{% if active=='home' %}on{% endif %}" href="/">首页</a>
    <a class="{% if active=='images' %}on{% endif %}" href="/images">图片</a>
    <a class="{% if active=='videos' %}on{% endif %}" href="/videos">视频</a>
    <a class="{% if active=='ai' %}on{% endif %}" href="/ai">AI</a>
    <a class="{% if active=='me' %}on{% endif %}" href="/me">我的</a>
  </nav>
  <div class="auth">
    {% if current_user %}
      <a class="btn" href="/user/{{ current_user['username'] }}">{{ current_user['display_name'] or current_user['username'] }}</a>
      {% if current_user['is_admin'] %}<span class="badge">管理员</span>{% endif %}
      <form action="/logout" method="post"><button type="submit">登出</button></form>
    {% else %}
      <a class="btn" href="/login?next={{ request.url.path if request else '/' }}">登录</a>
      <a class="btn" href="/register?next={{ request.url.path if request else '/' }}">注册</a>
    {% endif %}
  </div>
</header>
