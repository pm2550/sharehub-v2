{% extends "base.html" %}

{% block title %}{{ error }} - {{ site_title }}{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: var(--spacing-2xl) auto; text-align: center;">
    <div class="card" style="padding: var(--spacing-2xl);">
        <div style="font-size: 4rem; margin-bottom: var(--spacing-lg);">⚠️</div>
        <h1 style="margin-bottom: var(--spacing-md);">{{ error }}</h1>
        <p class="text-muted" style="margin-bottom: var(--spacing-xl);">{{ message }}</p>
        <a href="/" class="btn btn-primary">返回首页</a>
    </div>
</div>
{% endblock %}
