{% extends "base.html" %}
{% import "_studio.html" as ui with context %}
{% block body_class %}page-error{% endblock %}
{% block title %}{{ error }} - {{ site_title }}{% endblock %}
{% block content %}
<section class="error-layout"><span class="error-star" aria-hidden="true">✧</span><span class="eyebrow">A LITTLE DETOUR</span><h1>{{ error }}</h1><p>{{ message }}</p><div class="hero-actions"><a href="/" class="btn btn-primary">回到发现 {{ ui.icon('arrow') }}</a><a href="/search" class="btn btn-secondary">搜索灵感</a></div></section>
{% endblock %}
